
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatrice - Wang Yize</title>

    <style>
        body {
            font-family: Arial;
            text-align: left;
            margin-top: 50px;
        }

        input, button, select {
            padding: 10px;
            font-size: 16px;
        }

        #risultato {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>Calcolatrice</h1>
    <h3>Fatto da Wang Yize</h3>

    <input type="number" id="numero" placeholder="Inserisci un numero">

    <select id="operatore" onchange="scegliOperatore()">
        <option value="">Seleziona operatore</option>
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>

    <button onclick="calcola()">Calcola</button>
    <button onclick="reset()">Reset</button>

    <div id="risultato"></div>

    <script>

        let numeri = [];
        let operatori = [];

        function scegliOperatore() {

            let numero = document.getElementById("numero").value;

            if (numero == "") {
                return;
            }

            numeri[numeri.length] = Number(numero);

            operatori[operatori.length] = document.getElementById("operatore").value;

            document.getElementById("numero").value = "";
            document.getElementById("numero").placeholder = "Inserisci un altro numero";

            document.getElementById("operatore").value = "";

        }

        function calcola() {

            let numero = document.getElementById("numero").value;

            if (numero == "" || numeri.length == 0) {
                return;
            }

            numeri[numeri.length] = Number(numero);

            // Prima Moltiplicazioni e divisioni
            for (let i = 0; i < operatori.length; i++) {

                if (operatori[i] == "*") {

                    numeri[i + 1] = numeri[i] * numeri[i + 1];

                    numeri[i] = 0;
                    operatori[i] = "+";

                }

                else if (operatori[i] == "/") {

                    numeri[i + 1] = numeri[i] / numeri[i + 1];

                    numeri[i] = 0;
                    operatori[i] = "+";

                }

            }

            // Poi Addizioni e sottrazioni
            let risultato = numeri[0];

            for (let i = 0; i < operatori.length; i++) {

                switch (operatori[i]) {

                    case "+":
                        risultato = risultato + numeri[i + 1];
                        break;

                    case "-":
                        risultato = risultato - numeri[i + 1];
                        break;

                }

            }

            document.getElementById("risultato").innerHTML =
            "Risultato: " + risultato;

        }

        function reset() {

            numeri = [];
            operatori = [];

            document.getElementById("numero").value = "";
            document.getElementById("numero").placeholder = "Inserisci un numero";

            document.getElementById("operatore").value = "";

            document.getElementById("risultato").innerHTML = "";

        }

    </script>

</body>
</html>
